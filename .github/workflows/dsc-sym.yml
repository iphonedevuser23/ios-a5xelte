name: dsc-sym
# Symbolize unslid shared-cache addresses from a crash line against the root's dyld shared cache.
on:
  push:
    paths: ["tools/sym-addrs.txt"]
env:
  DEVICE: "iPhone10,3"
  VERSION: "16.7.16"
jobs:
  sym:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R blacktop/ipsw -p 'ipsw_*_linux_x86_64.tar.gz' -O ipsw.tgz
          mkdir -p ipswbin && tar -xzf ipsw.tgz -C ipswbin && sudo install "$(find ipswbin -type f -name ipsw | head -1)" /usr/local/bin/ipsw
          ipsw version
          url=$(curl -sf "https://api.ipsw.me/v4/device/$DEVICE?type=ipsw" | python3 -c "
          import json, sys
          fw = [f for f in json.load(sys.stdin)['firmwares'] if f['version'] == '$VERSION']
          print(fw[0]['url'])")
          echo "IPSW: $url"
          ipsw extract --remote --dyld -o dsc "$url" || { curl -sfL -o fw.ipsw "$url"; ipsw extract --dyld -o dsc fw.ipsw; rm -f fw.ipsw; }
          find dsc -type f | head -40
      - name: symbolize
        run: |
          d=$(dirname "$(find dsc -type f -name 'dyld_shared_cache_arm64' | head -1)")
          python3 tools/herolte-dsc-sym.py "$d" build
          python3 tools/herolte-dsc-sym.py "$d" $(cat tools/sym-addrs.txt)
          main="$d/dyld_shared_cache_arm64"
          for a in $(cat tools/sym-addrs.txt); do ipsw dsc a2s "$main" "$a" 2>&1 | tail -1 || true; done
          first=$(echo "$(cat tools/sym-addrs.txt)" | cut -d' ' -f1)
          ipsw dsc disass "$main" --vaddr $(python3 -c "print(hex($first-0x60))") --count 28 2>&1 | tail -40 || true
